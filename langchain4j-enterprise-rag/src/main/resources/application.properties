# The hospital feed: HL7v2 messages arrive on this MLLP port.
ward.feed.port=2575

# The ingestion pipeline. The MLLP route renders a clinical summary per event and hands
# it over on direct:ward-ingest; the langchain4j-ingest extension splits, embeds and
# stores it. The document id is version-aware (patient@event), set as a header by the
# route: a new event is a new document, first-write-wins per id.
quarkus.camel.langchain4j.ingest.ward.source.uri=direct:ward-ingest
quarkus.camel.langchain4j.ingest.ward.max-segment-size=800
quarkus.camel.langchain4j.ingest.ward.max-overlap-size=80

# The patient record system: a HAPI FHIR server, started by the Compose Dev Service
# (compose-devservices.yml) in dev and test mode, seeded with the Synthea patients at
# startup. The records route then runs its initial load: one full scan. Staying in
# sync afterwards is change tracking, not re-scanning; see the README.
# Tests reuse the compose project instead of starting an isolated copy: the FHIR port
# is fixed, so a second copy could not bind it while dev mode runs.
ward.fhir.url=http://localhost:8087/fhir
quarkus.compose.devservices.reuse-project-for-tests=true
# HAPI takes a while on a cold start; the default Dev Services timeout is 60s.
quarkus.devservices.timeout=180s
quarkus.camel.langchain4j.ingest.records.source.uri=direct:records-ingest
# A record summary is one fact per sentence, each naming the patient. Small segments
# keep retrieval sharp (one fact is never diluted by its neighbours), and since every
# sentence is self-contained there is nothing for an overlap to preserve.
quarkus.camel.langchain4j.ingest.records.max-segment-size=200
quarkus.camel.langchain4j.ingest.records.max-overlap-size=0

# The vector store: Qdrant through quarkus-langchain4j-qdrant. Dev Services start a
# Qdrant container in dev and test mode and pre-create the collection.
# embeddinggemma produces 768-dimensional vectors.
quarkus.langchain4j.qdrant.collection-name=ward
quarkus.qdrant.devservices.collections.ward.vector-size=768
quarkus.qdrant.devservices.collections.ward.distance=Cosine

# The chat model behind the ward AI service: a model served by Ollama. Pull it once
# with `ollama pull gemma4:e4b`; point OLLAMA_BASE_URL at an Ollama running elsewhere.
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:gemma4:e4b}
quarkus.langchain4j.ollama.chat-model.temperature=0.1
# Ollama defaults to a 4096-token context window: a question plus eight retrieved
# summaries is already ~2500 tokens, and a thinking model spends output tokens before
# the answer. When the window fills, generation stops mid-thought (done_reason=length)
# and the answer comes back empty.
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=8192
quarkus.langchain4j.ollama.timeout=120s
# Ollama is run by you rather than by Dev Services: pulling a model is a multi-gigabyte download
quarkus.langchain4j.ollama.devservices.enabled=false
# Embeddings come from embeddinggemma, served by the same Ollama as the chat model:
# pull it once with `ollama pull embeddinggemma:300m`. On this corpus it beats the
# in-process ONNX models (all-MiniLM-L6-v2, bge-small-en-v1.5) by a wide, measured
# margin: the expected patient ranks first on every demo question. Ingestion and
# retrieval share it, and everything still runs locally.
quarkus.langchain4j.ollama.embedding-model.model-id=${OLLAMA_EMBEDDING_MODEL:embeddinggemma:300m}

quarkus.langchain4j.log-requests=true

quarkus.langchain4j.log-responses=true
